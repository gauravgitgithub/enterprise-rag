# Deny all ingress in the namespace, then open only the paths the app uses.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-app
spec:
  podSelector:
    matchLabels:
      app: postgres
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [migrate, relay, worker, api]}
      ports:
        - port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tei-from-app
spec:
  podSelector:
    matchLabels:
      app: tei
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [worker, api]}
      ports:
        - port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: reranker-from-api
spec:
  podSelector:
    matchLabels:
      app: reranker
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - port: 8080
---
# The API is the public entry point. Every request still needs a valid token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: api-from-anywhere
spec:
  podSelector:
    matchLabels:
      app: api
  ingress:
    - ports:
        - port: 8000
