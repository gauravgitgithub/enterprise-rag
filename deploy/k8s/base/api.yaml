apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 80
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: enterprise-rag
          imagePullPolicy: IfNotPresent
          command: [uvicorn, enterprise_rag.api.main:app, --host=0.0.0.0, --port=8000]
          envFrom:
            - configMapRef:
                name: rag-config
          env:
            - name: RAG_APP_PASSWORD
              valueFrom:
                secretKeyRef: {name: rag-db, key: RAG_APP_PASSWORD}
            - name: RAG_DATABASE_URL
              value: postgresql+asyncpg://rag_app:$(RAG_APP_PASSWORD)@postgres:5432/rag
            - name: RAG_OPENAI_API_KEY
              valueFrom:
                secretKeyRef: {name: rag-openai, key: RAG_OPENAI_API_KEY}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /healthz, port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
