# Several replicas are safe (SKIP LOCKED); one is enough for this load.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: relay
  template:
    metadata:
      labels:
        app: relay
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30 # SIGTERM finishes the current batch, then exits
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: relay
          image: enterprise-rag
          imagePullPolicy: IfNotPresent
          command: [python, -m, enterprise_rag.relay]
          envFrom:
            - configMapRef:
                name: rag-config
            - secretRef:
                name: rag-aws
                optional: true # absent on AWS, where IRSA supplies credentials
          env:
            - name: RAG_RELAY_PASSWORD
              valueFrom:
                secretKeyRef: {name: rag-db, key: RAG_RELAY_PASSWORD}
            - name: RAG_RELAY_DATABASE_URL
              value: postgresql+asyncpg://rag_relay:$(RAG_RELAY_PASSWORD)@postgres:5432/rag
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
