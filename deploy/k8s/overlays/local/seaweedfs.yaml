apiVersion: v1
kind: Service
metadata:
  name: seaweedfs
spec:
  selector:
    app: seaweedfs
  ports:
    - name: s3
      port: 8333
    - name: master
      port: 9333
    # weed shell reaches the master and filer over gRPC (HTTP port + 10000).
    - name: master-grpc
      port: 19333
    - name: filer
      port: 8888
    - name: filer-grpc
      port: 18888
---
# shortcut: single-node, no S3 auth (any credentials work). Local dev only; real S3 elsewhere.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seaweedfs
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: seaweedfs
  template:
    metadata:
      labels:
        app: seaweedfs
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.50
          args: [server, -dir=/data, -s3, -ip.bind=0.0.0.0]
          ports:
            - containerPort: 8333
            - containerPort: 9333
          readinessProbe:
            tcpSocket: {port: 8333}
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: seaweedfs-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seaweedfs-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
# Idempotent: creates the documents bucket only if it is missing.
apiVersion: batch/v1
kind: Job
metadata:
  name: create-bucket
spec:
  ttlSecondsAfterFinished: 300
  backoffLimit: 10
  template:
    metadata:
      labels:
        app: create-bucket
    spec:
      restartPolicy: OnFailure
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-bucket
          image: chrislusf/seaweedfs:4.50
          command:
            - sh
            - -c
            - >-
              echo s3.bucket.list | weed shell -master=seaweedfs:9333 | grep -qw documents
              || echo 's3.bucket.create -name documents' | weed shell -master=seaweedfs:9333
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp # weed shell writes its glog files here
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
