apiVersion: v1
kind: Service
metadata:
  name: elasticmq
spec:
  selector:
    app: elasticmq
  ports:
    - port: 9324
---
# shortcut: in-memory queues, so messages in flight are lost when this pod restarts; the outbox
# still holds anything not yet relayed. Real SQS replaces it outside local dev.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elasticmq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: elasticmq
  template:
    metadata:
      labels:
        app: elasticmq
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: elasticmq
          image: softwaremill/elasticmq-native:1.7.1
          ports:
            - containerPort: 9324
          readinessProbe:
            tcpSocket: {port: 9324}
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /opt/elasticmq.conf
              subPath: elasticmq.conf
      volumes:
        - name: config
          configMap:
            name: elasticmq-config
