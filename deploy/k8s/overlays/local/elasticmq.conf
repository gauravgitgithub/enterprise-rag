include classpath("application.conf")

node-address {
  protocol = http
  host = elasticmq
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  ingest {
    # Matches VISIBILITY_TIMEOUT_S: longer than the slowest task.
    defaultVisibilityTimeout = 900 seconds
    receiveMessageWait = 20 seconds
    # A message redelivered this often is crashing workers (e.g. OOM): park it, don't loop.
    deadLettersQueue {
      name = "ingest-dlq"
      maxReceiveCount = 3
    }
  }
  ingest-dlq {}
}
