name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Docling's layout models (~800 MB) download from Hugging Face on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('uv.lock') }}
          restore-keys: hf-
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      # kubectl ships on GitHub's runners. Rendering catches broken kustomizations and references.
      - name: Kubernetes manifests
        run: |
          cp deploy/k8s/overlays/local/secrets.env.example deploy/k8s/overlays/local/secrets.env
          cp deploy/k8s/overlays/local/openai.env.example deploy/k8s/overlays/local/openai.env
          uv run python scripts/dev_idp.py
          kubectl kustomize deploy/k8s/overlays/local > /dev/null
      # Tests start their own Postgres 18 + pgvector container via testcontainers.
      - name: Tests
        run: uv run pytest -q
      # Every mutant must be caught, proving the tests can fail.
      - name: Mutation check
        run: uv run python scripts/mutation_check.py

  # Retrieval quality gate: the real embedder and reranker on a fixed corpus (evals/).
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TEI_IMAGE: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # bge-m3 and bge-reranker-v2-m3 are ~2.2 GB each; download once, then restore.
      - uses: actions/cache@v4
        with:
          path: ~/tei-models
          key: tei-bge-m3-bge-reranker-v2-m3-v1
      # Flags match deploy/k8s/base/tei.yaml.
      - name: Start TEI
        run: |
          mkdir -p ~/tei-models
          for spec in "tei 8080 BAAI/bge-m3" "reranker 8081 BAAI/bge-reranker-v2-m3"; do
            set -- $spec
            docker run -d --name "$1" -p "$2:80" -v ~/tei-models:/data "$TEI_IMAGE" \
              --model-id "$3" --max-client-batch-size 32 --max-batch-tokens 2048
          done
          for port in 8080 8081; do
            timeout 1200 bash -c "until curl -sf localhost:$port/health; do sleep 5; done"
          done
      - name: Retrieval eval
        env:
          RAG_TEI_URL: http://localhost:8080
          RAG_RERANK_URL: http://localhost:8081
        run: uv run pytest -m eval -s
      - if: failure()
        run: docker logs tei --tail 50; docker logs reranker --tail 50
