name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      # Docling's layout models (~800 MB) download from Hugging Face on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('uv.lock') }}
          restore-keys: hf-
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy src
      # Tests start their own Postgres 18 + pgvector container via testcontainers.
      - name: Tests
        run: uv run pytest -q
      # Every mutant must be caught, proving the tests can fail.
      - name: Mutation check
        run: uv run python scripts/mutation_check.py
