[project]
name = "enterprise-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "celery[sqs]>=5.6.3",
    "en-core-web-md",
    "pgvector>=0.5.1",
    "presidio-analyzer>=2.2.366",
    "presidio-anonymizer>=2.2.366",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
]

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "TID"]
ignore = ["S101"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# All DB access goes through repositories built from SQLAlchemy expressions.
"sqlalchemy.text".msg = "No raw SQL. Use SQLAlchemy expressions inside a repository."
"sqlalchemy.sql.text".msg = "No raw SQL. Use SQLAlchemy expressions inside a repository."

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["TID251", "E501"]
"tests/**" = ["S105", "S106", "S603", "S607"]
# Dev tool: runs pytest on fixed, in-repo arguments.
"scripts/**" = ["S603", "S607"]

[[tool.mypy.overrides]]
# Celery and kombu ship no type information.
module = ["celery.*", "kombu.*"]
ignore_missing_imports = true

[tool.uv.sources]
en-core-web-md = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl" }
